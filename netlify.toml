[build]
  publish = "public"


[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vault/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Unpublished drafts. Two articles in the fiscal representation cluster are
# awaiting review by the independent Certified Accountant and must not be
# indexed. Each page also carries <meta name="robots" content="noindex,
# nofollow"> and is absent from public/sitemap.xml. Delete the matching block
# below when the article is approved for publication.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/en/blog/fiscal-representation-property-owners-portugal"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/en/blog/fiscal-representation-property-owners-portugal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/en/blog/nif-fiscal-representation-d7-visa-health-insurance"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/en/blog/nif-fiscal-representation-d7-visa-health-insurance/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/vault/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/metrics/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/insurance-chat"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/email-signature.html"
  [headers.values]
    Content-Disposition = "attachment; filename=\"assinatura-email-adler-rochefort.html\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/vault/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/vault/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/vault/"


# ---------------------------------------------------------------------------
# Contact — the EN site keeps its contact form in the #contact section of the
# homepage. Resolve the canonical /en/contact path to that section.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/en/contact"
  to = "/en/#contact"
  status = 301
  force = true


# ---------------------------------------------------------------------------
# Short links with UTM tracking (302 redirects)
# Convention for new short links:
#   utm_source = channel  (instagram / linkedin / facebook / emailsignature)
#   utm_medium = format   (social / bio / story / referral)
#   utm_campaign = theme  (saude-expat / seguro-auto / al-hotelaria /
#                          comparador-seguradoras / institucional)
# To add a new short link, copy a block below and adjust from / to.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/go/ig-bio"
  to = "/en/health-insurance-quote/?utm_source=instagram&utm_medium=bio&utm_campaign=saude-expat"
  status = 302
  force = true

[[redirects]]
  from = "/go/ig-saude"
  to = "/blog/seguro-saude-expatriados-portugal/?utm_source=instagram&utm_medium=social&utm_campaign=saude-expat"
  status = 302
  force = true

[[redirects]]
  from = "/go/ig-story-saude"
  to = "/en/health-insurance-quote/?utm_source=instagram&utm_medium=story&utm_campaign=saude-expat"
  status = 302
  force = true

[[redirects]]
  from = "/go/li-al"
  to = "/blog/seguros-obrigatorios-hotelaria-turismo/?utm_source=linkedin&utm_medium=social&utm_campaign=al-hotelaria"
  status = 302
  force = true

[[redirects]]
  from = "/go/fb-home"
  to = "/?utm_source=facebook&utm_medium=social&utm_campaign=institucional"
  status = 302
  force = true

[[redirects]]
  from = "/go/email"
  to = "/?utm_source=emailsignature&utm_medium=referral&utm_campaign=institucional"
  status = 302
  force = true
