<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5A45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33402F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D9A668;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C088;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF7EE;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#FAF7EE;stop-opacity:0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <circle cx="1050" cy="80" r="200" fill="#7A9A6B" opacity="0.08" />
  <circle cx="150" cy="550" r="180" fill="#7A9A6B" opacity="0.06" />
  <circle cx="600" cy="315" r="350" fill="#7A9A6B" opacity="0.04" />

  <line x1="80" y1="100" x2="80" y2="530" stroke="#7A9A6B" stroke-width="1" opacity="0.15" />
  <line x1="1120" y1="100" x2="1120" y2="530" stroke="#7A9A6B" stroke-width="1" opacity="0.15" />

  <rect x="80" y="100" width="2" height="60" fill="url(#accent)" opacity="0.6" />

  <text x="120" y="140" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#D9A668" opacity="0.9">ALOJAMENTO LOCAL · CUSTOS</text>

  <text x="120" y="210" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="120" dy="0">Quanto custa o</tspan>
    <tspan x="120" dy="58">seguro de</tspan>
    <tspan x="120" dy="58">Alojamento Local?</tspan>
  </text>

  <rect x="120" y="365" width="60" height="3" fill="url(#accent)" rx="1.5" />

  <text x="120" y="405" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.7" letter-spacing="0.3">
    <tspan x="120" dy="0">Capitais mínimos, franquias e o essencial</tspan>
  </text>
  <text x="120" y="430" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5" letter-spacing="0.3">
    <tspan x="120" dy="0">O que deve exigir à sua seguradora</tspan>
  </text>

  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="380" height="330" rx="4" fill="url(#cardBg)" stroke="#7A9A6B" stroke-width="0.5" opacity="0.4" />

    <g transform="translate(40, 40)">
      <rect width="300" height="52" rx="3" fill="#7A9A6B" opacity="0.15" />
      <text x="20" y="22" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#D9A668" letter-spacing="2">PRÉMIO ANUAL</text>
      <text x="20" y="40" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">Tipicamente 120 € a 400 € / ano</text>
    </g>

    <g transform="translate(40, 110)">
      <rect width="300" height="52" rx="3" fill="#7A9A6B" opacity="0.15" />
      <text x="20" y="22" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#D9A668" letter-spacing="2">CAPITAL RC</text>
      <text x="20" y="40" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">Mínimo 75.000 € por sinistro</text>
    </g>

    <g transform="translate(40, 180)">
      <rect width="300" height="52" rx="3" fill="#7A9A6B" opacity="0.15" />
      <text x="20" y="22" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#D9A668" letter-spacing="2">FRANQUIA</text>
      <text x="20" y="40" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">O valor que sai do seu bolso</text>
    </g>

    <g transform="translate(40, 260)">
      <rect width="140" height="36" rx="18" fill="#D9A668" opacity="0.9" />
      <text x="70" y="23" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#33402F" text-anchor="middle" letter-spacing="1">CHECKLIST</text>
      <rect x="160" y="0" width="140" height="36" rx="18" fill="#7A9A6B" opacity="0.3" />
      <text x="230" y="23" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">3 COTAÇÕES</text>
    </g>
  </g>

  <rect x="80" y="490" width="1040" height="1" fill="#7A9A6B" opacity="0.15" />
  <text x="120" y="530" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.35" letter-spacing="2">ADLER &amp; ROCHEFORT · MEDIAÇÃO DE SEGUROS</text>

  <text x="1080" y="530" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#D9A668" opacity="0.5" letter-spacing="1" text-anchor="end">adlerrochefort.com</text>
</svg>
