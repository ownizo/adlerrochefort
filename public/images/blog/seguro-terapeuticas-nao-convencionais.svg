<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5A45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33402F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94B585;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7A9A6B;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94B585" />
      <stop offset="100%" style="stop-color:#7A9A6B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9A668" />
      <stop offset="100%" style="stop-color:#C4934F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle pattern circles -->
  <circle cx="150" cy="100" r="200" fill="url(#glow)" opacity="0.4"/>
  <circle cx="1050" cy="575" r="250" fill="url(#glow)" opacity="0.3"/>
  <circle cx="600" cy="337" r="300" fill="url(#glow)" opacity="0.15"/>

  <!-- Decorative line pattern -->
  <line x1="80" y1="0" x2="80" y2="675" stroke="#7A9A6B" stroke-width="0.5" opacity="0.15"/>
  <line x1="160" y1="0" x2="160" y2="675" stroke="#7A9A6B" stroke-width="0.5" opacity="0.1"/>
  <line x1="1040" y1="0" x2="1040" y2="675" stroke="#7A9A6B" stroke-width="0.5" opacity="0.1"/>
  <line x1="1120" y1="0" x2="1120" y2="675" stroke="#7A9A6B" stroke-width="0.5" opacity="0.15"/>

  <!-- Lotus flower - center piece -->
  <g transform="translate(600, 280)" opacity="0.9">
    <!-- Outer petals -->
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(0)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(30)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(90)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(120)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(150)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(180)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(210)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(240)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(270)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(300)"/>
    <ellipse cx="0" cy="-60" rx="22" ry="55" fill="url(#leaf)" opacity="0.6" transform="rotate(330)"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="20" fill="url(#accent)" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="#D9A668" opacity="0.5"/>
  </g>

  <!-- Acupuncture needles - left -->
  <g transform="translate(200, 250)" opacity="0.5">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#D9A668" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#D9A668"/>
    <line x1="25" y1="10" x2="25" y2="110" stroke="#D9A668" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="25" cy="10" r="3" fill="#D9A668"/>
    <line x1="50" y1="5" x2="50" y2="105" stroke="#D9A668" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="50" cy="5" r="3" fill="#D9A668"/>
  </g>

  <!-- Herb/leaf motif - right -->
  <g transform="translate(950, 200)" opacity="0.5">
    <path d="M0,80 Q20,40 10,0 Q30,30 40,0 Q30,40 50,80" fill="none" stroke="#94B585" stroke-width="2"/>
    <ellipse cx="10" cy="25" rx="12" ry="20" fill="#7A9A6B" opacity="0.3" transform="rotate(-15, 10, 25)"/>
    <ellipse cx="40" cy="25" rx="12" ry="20" fill="#7A9A6B" opacity="0.3" transform="rotate(15, 40, 25)"/>
    <ellipse cx="25" cy="10" rx="10" ry="18" fill="#7A9A6B" opacity="0.3"/>
  </g>

  <!-- Yin-Yang symbol - small decorative -->
  <g transform="translate(350, 420)" opacity="0.35">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#94B585" stroke-width="1.5"/>
    <path d="M0,-30 A30,30 0 0,1 0,30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,-30" fill="#94B585" opacity="0.4"/>
    <circle cx="0" cy="-15" r="4" fill="#33402F" opacity="0.6"/>
    <circle cx="0" cy="15" r="4" fill="#94B585" opacity="0.6"/>
  </g>

  <!-- Yoga pose silhouette - small decorative -->
  <g transform="translate(850, 430)" opacity="0.3">
    <circle cx="0" cy="-35" r="8" fill="#D9A668"/>
    <path d="M0,-27 L0,-5 M-20,10 L0,-5 L20,10 M-15,-18 L0,-12 L15,-18" fill="none" stroke="#D9A668" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title area -->
  <text x="600" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#FAF7EE" opacity="0.9" letter-spacing="2">RESPONSABILIDADE CIVIL</text>
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#D9A668" opacity="0.8" letter-spacing="4">TERAPIAS COMPLEMENTARES</text>

  <!-- Decorative line under title -->
  <line x1="480" y1="560" x2="720" y2="560" stroke="#D9A668" stroke-width="1" opacity="0.4"/>

  <!-- Small icons row -->
  <g transform="translate(600, 610)" opacity="0.4">
    <text x="-200" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FAF7EE" letter-spacing="2">ACUPUNCTURA</text>
    <text x="-60" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FAF7EE" letter-spacing="2">NATUROPATIA</text>
    <text x="75" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FAF7EE" letter-spacing="2">HOMEOPATIA</text>
    <text x="200" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FAF7EE" letter-spacing="2">YOGA</text>
  </g>

  <!-- Dots separators -->
  <circle cx="470" cy="607" r="2" fill="#D9A668" opacity="0.3"/>
  <circle cx="540" cy="607" r="2" fill="#D9A668" opacity="0.3"/>
  <circle cx="608" cy="607" r="2" fill="#D9A668" opacity="0.3"/>
  <circle cx="670" cy="607" r="2" fill="#D9A668" opacity="0.3"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="#7A9A6B" stroke-width="0.5" opacity="0.2" rx="2"/>
</svg>