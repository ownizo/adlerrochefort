<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5A45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33402F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7A9A6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94B585;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.04" />
    </linearGradient>
    <clipPath id="round-card">
      <rect x="640" y="100" width="500" height="475" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle geometric pattern -->
  <circle cx="1100" cy="100" r="300" fill="rgba(122,154,107,0.06)" />
  <circle cx="100" cy="600" r="200" fill="rgba(122,154,107,0.04)" />
  <circle cx="900" cy="550" r="150" fill="rgba(217,166,104,0.05)" />

  <!-- Decorative line -->
  <line x1="60" y1="140" x2="60" y2="540" stroke="#7A9A6B" stroke-width="3" opacity="0.4"/>

  <!-- Category tag -->
  <rect x="80" y="140" width="220" height="32" rx="4" fill="#7A9A6B"/>
  <text x="190" y="161" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SEGUROS DE SAÚDE</text>

  <!-- Main title -->
  <text x="80" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="80" dy="0">Seguro de Saúde para</tspan>
    <tspan x="80" dy="48">Expatriados em Portugal</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="rgba(255,255,255,0.7)" letter-spacing="0.2">
    <tspan x="80" dy="0">Guia completo: como escolher, o que cobrem</tspan>
    <tspan x="80" dy="26">e porquê ter um mediador ao seu lado.</tspan>
  </text>

  <!-- Partner logos section -->
  <text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="3">PARCEIROS</text>

  <!-- Allianz card -->
  <rect x="80" y="420" width="145" height="50" rx="8" fill="url(#card-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="152" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Allianz</text>

  <!-- Medis card -->
  <rect x="240" y="420" width="120" height="50" rx="8" fill="url(#card-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="300" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Medis</text>

  <!-- AdvanceCare card -->
  <rect x="375" y="420" width="175" height="50" rx="8" fill="url(#card-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="462" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AdvanceCare</text>

  <!-- Right side illustration - Health/Shield concept -->
  <rect x="640" y="100" width="500" height="475" rx="20" fill="url(#card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Large health shield icon -->
  <g transform="translate(810, 200)">
    <!-- Shield shape -->
    <path d="M80 0 L160 30 L160 100 C160 160 120 200 80 220 C40 200 0 160 0 100 L0 30 Z" fill="rgba(122,154,107,0.25)" stroke="#7A9A6B" stroke-width="2"/>
    <!-- Cross inside shield -->
    <rect x="60" y="60" width="40" height="100" rx="6" fill="#7A9A6B" opacity="0.8"/>
    <rect x="30" y="90" width="100" height="40" rx="6" fill="#7A9A6B" opacity="0.8"/>
  </g>

  <!-- Small icons around shield -->
  <!-- Globe icon (expat) -->
  <g transform="translate(680, 160)">
    <circle cx="25" cy="25" r="25" fill="rgba(217,166,104,0.2)" stroke="#D9A668" stroke-width="1.5"/>
    <ellipse cx="25" cy="25" rx="10" ry="25" fill="none" stroke="#D9A668" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="25" x2="50" y2="25" stroke="#D9A668" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="12" x2="45" y2="12" stroke="#D9A668" stroke-width="0.8" opacity="0.4"/>
    <line x1="5" y1="38" x2="45" y2="38" stroke="#D9A668" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Family icon -->
  <g transform="translate(1050, 160)">
    <circle cx="20" cy="20" r="25" fill="rgba(122,154,107,0.15)" stroke="#7A9A6B" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="5" fill="none" stroke="#7A9A6B" stroke-width="1.5"/>
    <circle cx="26" cy="14" r="5" fill="none" stroke="#7A9A6B" stroke-width="1.5"/>
    <path d="M4 35 C4 25 14 22 14 22" fill="none" stroke="#7A9A6B" stroke-width="1.5"/>
    <path d="M36 35 C36 25 26 22 26 22" fill="none" stroke="#7A9A6B" stroke-width="1.5"/>
  </g>

  <!-- Document/Policy icon -->
  <g transform="translate(680, 430)">
    <rect x="5" y="0" width="35" height="45" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="13" y1="12" x2="33" y2="12" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="13" y1="20" x2="33" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="13" y1="28" x2="25" y2="28" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <path d="M28 32 L33 37 L43 27" fill="none" stroke="#7A9A6B" stroke-width="2"/>
  </g>

  <!-- Heart/Health icon -->
  <g transform="translate(1060, 430)">
    <circle cx="20" cy="22" r="25" fill="rgba(217,166,104,0.12)" stroke="rgba(217,166,104,0.3)" stroke-width="1"/>
    <path d="M20 35 C10 25 5 18 5 13 C5 7 10 3 15 5 C18 6 20 10 20 10 C20 10 22 6 25 5 C30 3 35 7 35 13 C35 18 30 25 20 35Z" fill="none" stroke="#D9A668" stroke-width="1.5"/>
  </g>

  <!-- Floating connection lines -->
  <line x1="730" y1="210" x2="810" y2="250" stroke="rgba(122,154,107,0.2)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1070" y1="210" x2="990" y2="250" stroke="rgba(122,154,107,0.2)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="725" y1="455" x2="810" y2="400" stroke="rgba(122,154,107,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1060" y1="455" x2="990" y2="400" stroke="rgba(122,154,107,0.15)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bottom bar -->
  <rect x="0" y="595" width="1200" height="80" fill="rgba(0,0,0,0.2)"/>
  <text x="80" y="642" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">adlerrochefort.com</text>

  <!-- Brand accent line -->
  <rect x="80" y="540" width="60" height="3" rx="1.5" fill="#D9A668"/>

  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">Adler &amp; Rochefort · Insurtech de Proteção 360</text>
</svg>