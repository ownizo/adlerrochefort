<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111927;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111927;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8323E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D98A94;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1E8;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#F5F1E8;stop-opacity:0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <circle cx="1050" cy="80" r="200" fill="#17243D" opacity="0.08" />
  <circle cx="150" cy="550" r="180" fill="#17243D" opacity="0.06" />
  <circle cx="600" cy="315" r="350" fill="#17243D" opacity="0.04" />

  <line x1="80" y1="100" x2="80" y2="530" stroke="#17243D" stroke-width="1" opacity="0.15" />
  <line x1="1120" y1="100" x2="1120" y2="530" stroke="#17243D" stroke-width="1" opacity="0.15" />

  <rect x="80" y="100" width="2" height="60" fill="url(#accent)" opacity="0.6" />

  <text x="120" y="140" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#B8323E" opacity="0.9">ALOJAMENTO LOCAL &amp; LEGISLAÇÃO</text>

  <text x="120" y="210" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="120" dy="0">Seguro Obrigatório</tspan>
    <tspan x="120" dy="58">para Alojamento Local.</tspan>
    <tspan x="120" dy="58">O que mudou em 2025.</tspan>
  </text>

  <rect x="120" y="365" width="60" height="3" fill="url(#accent)" rx="1.5" />

  <text x="120" y="405" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.7" letter-spacing="0.3">
    <tspan x="120" dy="0">Decreto-Lei n.º 76/2024 · Novas regras para AL</tspan>
  </text>
  <text x="120" y="430" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5" letter-spacing="0.3">
    <tspan x="120" dy="0">Responsabilidade civil · Capitais mínimos</tspan>
  </text>

  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="380" height="330" rx="4" fill="url(#cardBg)" stroke="#17243D" stroke-width="0.5" opacity="0.4" />

    <g transform="translate(40, 40)">
      <rect width="300" height="52" rx="3" fill="#17243D" opacity="0.15" />
      <text x="20" y="22" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#B8323E" letter-spacing="2">OBRIGATÓRIO</text>
      <text x="20" y="40" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">Responsabilidade Civil do AL</text>
    </g>

    <g transform="translate(40, 110)">
      <rect width="300" height="52" rx="3" fill="#17243D" opacity="0.15" />
      <text x="20" y="22" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#B8323E" letter-spacing="2">CAPITAL MÍNIMO</text>
      <text x="20" y="40" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">A partir de 75.000 € por sinistro</text>
    </g>

    <g transform="translate(40, 180)">
      <rect width="300" height="52" rx="3" fill="#17243D" opacity="0.15" />
      <text x="20" y="22" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#B8323E" letter-spacing="2">FISCALIZAÇÃO</text>
      <text x="20" y="40" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">Cancelamento do registo em falta</text>
    </g>

    <g transform="translate(40, 260)">
      <rect width="140" height="36" rx="18" fill="#B8323E" opacity="0.9" />
      <text x="70" y="23" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#111927" text-anchor="middle" letter-spacing="1">DL 76/2024</text>
      <rect x="160" y="0" width="140" height="36" rx="18" fill="#17243D" opacity="0.3" />
      <text x="230" y="23" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AL 2025</text>
    </g>
  </g>

  <rect x="80" y="490" width="1040" height="1" fill="#17243D" opacity="0.15" />
  <text x="120" y="530" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.35" letter-spacing="2">ADLER &amp; ROCHEFORT · MEDIAÇÃO DE SEGUROS</text>

  <text x="1080" y="530" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#B8323E" opacity="0.5" letter-spacing="1" text-anchor="end">adlerrochefort.com</text>
</svg>
