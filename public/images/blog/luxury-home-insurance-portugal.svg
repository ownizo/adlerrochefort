      <text x="20" y="26" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#D9A668" letter-spacing="2">ALL-RISKS COVER</text>
      <text x="20" y="48" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.85">Beyond named perils, no proportional rule</text>
    </g>

    <g transform="translate(40, 122)">
