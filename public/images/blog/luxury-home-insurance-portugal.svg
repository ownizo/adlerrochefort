  <rect x="120" y="360" width="60" height="3" fill="url(#accent)" rx="1.5" />

  <text x="120" y="400" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.7" letter-spacing="0.3">
